name: Release & Build Daemon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build SubSkiff Daemon (Linux musl)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build musl binary
        working-directory: daemon
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          ls -lh target/x86_64-unknown-linux-musl/release/subskiff-daemon

      - name: Package tar.gz
        run: |
          mkdir -p dist
          cp daemon/target/x86_64-unknown-linux-musl/release/subskiff-daemon dist/
          cp LICENSE dist/
          cp README.md dist/
          tar -czf subskiff-daemon-linux-amd64.tar.gz -C dist subskiff-daemon LICENSE README.md
          cp daemon/target/x86_64-unknown-linux-musl/release/subskiff-daemon subskiff-daemon

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            subskiff-daemon-linux-amd64.tar.gz
            subskiff-daemon
            ldnat.sh
          generate_release_notes: true
